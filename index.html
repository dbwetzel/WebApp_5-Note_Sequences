<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.1.3/Tone.js"></script>
    <link rel="stylesheet" type="text/css" href="sequences.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
      <div id="title"><h1>Note Sequence Designer (beta v. 0.2)</h1>
        <p><i>editor/player interface by D. B. Wetzel (Nov. 2025) for COMP/MUSC 122 Intro to Digital Music (LUC)</i></p>
        
      </div>
      <div class="machine">
        <!-- container div for beats and editors -->
        <div id = "metronome" class="metronome">
          <!-- P5 instance of metroGUI -->
        </div>
        <div id="editor" class="controller">
          <!-- P5 Instance of sequenceGUI editor -->
        </div>
        <div id="SequenceLib">
          <h3>Sequence Players</h3>
        </div>
        <div id="container" class="container" display="block"> <!--display/hide-->
          <div id="sequences" class="sequences">
            <!-- P5 instances of sequence GUIs from sequences.json -->
          </div> 
        </div>
      </div>


    <div class="data">
        <h2>Sequencer Data (JSON)</h2> 
        <button id = "download">Download JSON</button>
        <input type="file" id="fileElem" style="display:none" />
        <button id = "upload">Open JSON (edit previous)</button>
      <button id = "copy">Copy to Clipboard</button>
        <pre class="json" id="json"></pre>
    </div>
      <div>
<!--        <button id="fileSelect" type="button">Upload Sample File</button>
        <input type="file" id="fileElem" style="display:none" accept="audio/*"/>
      -->      </div>
    </main>
    <script src = "qrcode.min.js"></script>
    <script src = "FileSaver.min.js"></script>
    <script src = "jszip.min.js"></script>
    <script src="metroGUI.js"></script>
    <script src="sequencerGUI.js"></script>
    <script src="seqGUI.js"></script>
    <script src="sequencer.js"></script>
    
    

    <!-- <script src="beats.js"></script> -->
  </body>
</html>
